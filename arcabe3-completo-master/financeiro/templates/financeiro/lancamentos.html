{% extends 'base.html' %}
{% block 'body' %}<div class="mx-auto max-w-7xl p-8"><h1 class="text-2xl font-bold">Lançamentos</h1>{% if role == 'FULL' %}<form method="post" class="space-y-2">{% csrf_token %}<input name="descricao" placeholder="Descrição" required><input name="valor" type="number" step="0.01" required><input name="vencimento" type="date" required><input name="parcelas" type="number" min="1" value="1"><select name="tipo"><option value="RECEITA">Receita</option><option value="DESPESA">Despesa</option><option value="INTERNO">Registro Interno</option></select><button type="submit">Salvar</button></form>{% endif %}<table>{% for l in lancamentos %}<tr><td>{{ l.vencimento }}</td><td>{{ l.descricao }}</td><td>{{ l.tipo }}</td><td>{{ l.valor }}</td></tr>{% endfor %}</table></div>{% endblock %}
