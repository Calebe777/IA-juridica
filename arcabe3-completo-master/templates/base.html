<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block 'title' %}Painel Jurídico{% endblock 'title' %}</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        {% block 'head' %}
        {% endblock 'head' %}
    </head>
    <body id="app-body" class="min-h-screen bg-slate-100 text-slate-900 antialiased transition-colors duration-200">
        <button id="theme-toggle" class="fixed right-4 top-4 z-50 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-100" type="button">🌙 Modo escuro</button>
        {% block 'body' %}
        {% endblock 'body' %}
        <script>
            (() => {
                const root = document.documentElement;
                const body = document.getElementById('app-body');
                const button = document.getElementById('theme-toggle');
                const saved = localStorage.getItem('painel-theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

                const applyTheme = (theme) => {
                    const dark = theme === 'dark';
                    root.setAttribute('data-theme', theme);
                    body.className = dark
                        ? 'min-h-screen bg-slate-950 text-slate-100 antialiased transition-colors duration-200'
                        : 'min-h-screen bg-slate-100 text-slate-900 antialiased transition-colors duration-200';

                    button.className = dark
                        ? 'fixed right-4 top-4 z-50 rounded-lg border border-slate-700 bg-slate-800 px-3 py-2 text-sm font-semibold text-slate-100 shadow-sm transition hover:bg-slate-700'
                        : 'fixed right-4 top-4 z-50 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:bg-slate-100';

                    button.textContent = dark ? '☀️ Modo claro' : '🌙 Modo escuro';
                };

                applyTheme(saved || (prefersDark ? 'dark' : 'light'));
                button.addEventListener('click', () => {
                    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                    localStorage.setItem('painel-theme', next);
                    applyTheme(next);
                });
            })();
        </script>
    </body>
</html>
